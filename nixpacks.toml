# Railway usa Nixpacks para construir este servicio automaticamente (no
# hay Dockerfile). Por default Nixpacks solo instala lo que un proyecto
# Node necesita -- pg_dump/pg_restore (usados por el sistema de respaldos,
# src/services/backup.service.ts) requieren el cliente de PostgreSQL, que
# hay que pedir explicitamente aqui. Se usa nixPkgs (no aptPkgs): el
# paquete Nix se resuelve del cache de Nix en el build, mientras que
# aptPkgs depende de acceso de red a los repos de Debian durante el build
# y puede fallar en silencio -- eso dejo el binario ausente en produccion
# (spawn pg_dump ENOENT) aunque el build "terminara bien".
#
# El "..." es obligatorio: sin el, esta lista REEMPLAZA por completo la
# que Nixpacks detecta automaticamente para el proyecto (nodejs, npm),
# no se le agrega -- eso causo un build roto ("npm: command not found").
#
# Se pide postgresql_18 (version especifica) y no "postgresql" (generico)
# porque pg_dump se niega a correr contra un servidor de version MAYOR a
# la suya -- el paquete generico resolvio en 17.2 mientras que Postgres de
# Railway corre 18.4, y eso truena con "aborting because of server
# version mismatch". Si Railway llega a subir de major version otra vez,
# este numero hay que actualizarlo junto con el.
[phases.setup]
nixPkgs = ["...", "postgresql_18"]
